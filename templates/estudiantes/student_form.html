{% extends 'base.html' %}

{% block title %}{{ 'Editar' if student else 'Añadir' }} Estudiante{% endblock %}

{% block content %}

<h1>{{ 'Editar' if student else 'Añadir' }} Estudiante</h1>
<hr>

<form method="post">
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" name="nombre"
            value="{{ student.nombre if student else '' }}" required>
    </div>
    <div class="mb-3">
        <label for="apellido_paterno" class="form-label">Apellido Paterno</label>
        <input type="text" class="form-control" id="apellido_paterno" name="apellido_paterno"
            value="{{ student.apellido_paterno if student else '' }}" required>
    </div>
    <div class="mb-3">
        <label for="apellido_materno" class="form-label">Apellido Materno</label>
        <input type="text" class="form-control" id="apellido_materno" name="apellido_materno"
            value="{{ student.apellido_materno if student else '' }}" required>
    </div>
    <div class="mb-3">
        <label for="correo" class="form-label">Correo Electrónico</label>
        <input type="email" class="form-control" id="correo" name="correo"
            value="{{ student.correo if student else '' }}" required>
    </div>

    {% if not student %}
    <div class="mb-3">
        <label for="idcarrera" class="form-label">Carrera</label>
        <select class="form-select" id="idcarrera" name="idcarrera" required>
            <option value="">Seleccione una carrera...</option>
            {% for carrera in carreras %}
            <option value="{{ carrera.idcarrera }}">{{ carrera.descripcion_carrera }}</option>
            {% endfor %}
        </select>
    </div>
    {% endif %}

    <button type="submit" class="btn btn-primary">
        {{ 'Actualizar' if student else 'Guardar' }}
    </button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
