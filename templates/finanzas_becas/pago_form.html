{% extends 'base.html' %}
{% block title %}Registrar Pago{% endblock %}
{% block content %}
<h2>Registrar Pago</h2>
<form method="POST">
    <div class="mb-3">
        <label for="idestadodecuenta" class="form-label">Estudiante</label>
        <select class="form-select" id="idestadodecuenta" name="idestadodecuenta" required>
            <option value="">Seleccione estudiante</option>
            {% for e in estudiantes %}
            <option value="{{ e.idestadodecuenta }}">{{ e.nombre_completo }} ({{ e.matricula_alumno }}) - Saldo: ${{
                e.saldo_actual }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="monto" class="form-label">Monto del Pago</label>
        <input type="number" step="0.01" min="0.01" class="form-control" id="monto" name="monto" required>
    </div>
    <button type="submit" class="btn btn-success">Registrar Pago</button>
    <a href="{{ url_for('list_pagos') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
