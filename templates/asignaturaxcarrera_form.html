{% extends "base.html" %}

{% block title %}Añadir Asignatura por Carrera{% endblock %}

{% block content %}
<h1>Añadir Asignatura por Carrera</h1>
<hr>

<form method="post">

    <!-- CARRERAS -->
    <div class="mb-3">
        <label class="form-label">Carrera</label>
        <select name="idcarrera" class="form-select" required>
            <option value="">Seleccione una carrera...</option>
            {% for c in carreras %}
            <option value="{{ c.idcarrera }}">
                {{ c.idcarrera }} - {{ c.descripcion_carrera }}
            </option>
            {% endfor %}
        </select>
    </div>

    <!-- ASIGNATURAS -->
    <div class="mb-3">
        <label class="form-label">Asignatura</label>
        <select name="idasignatura" class="form-select" required>
            <option value="">Seleccione una asignatura...</option>
            {% for a in asignaturas %}
            <option value="{{ a.idasignatura }}">
                {{ a.idasignatura }} - {{ a.nombre_asignatura }}
            </option>
            {% endfor %}
        </select>
    </div>

    <!-- DEPARTAMENTO ACADÉMICO -->
    <div class="mb-3">
        <label class="form-label">Departamento Académico</label>
        <select name="iddepartamentoacademico" class="form-select" required>
            <option value="">Seleccione un departamento...</option>
            {% for d in departamentos %}
            <option value="{{ d.iddepartamentoacademico }}">
                {{ d.iddepartamentoacademico }} - {{ d.nombre_departamento }}
            </option>
            {% endfor %}
        </select>
    </div>

    <button class="btn btn-primary" type="submit">Guardar</button>
    <a class="btn btn-secondary" href="{{ url_for('list_asignaturaxcarrera') }}">Cancelar</a>

</form>

{% endblock %}
