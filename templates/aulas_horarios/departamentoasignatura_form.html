{% extends 'base.html' %}

{% block title %}{{ 'Editar' if departamento else 'Añadir' }} Departamento{% endblock %}

{% block content %}
<h1>{{ 'Editar' if departamento else 'Añadir' }} Departamento de Asignatura</h1>
<hr>

<form method="post">

    {# ID is auto-generated #}

    <div class="mb-3">
        <label class="form-label">Nombre del Departamento</label>
        <input type="text" class="form-control" name="nombre_deptoasignatura"
            value="{{ departamento.nombre_deptoasignatura if departamento else '' }}" required>
    </div>

    <button type="submit" class="btn btn-primary">
        {{ 'Actualizar' if departamento else 'Guardar' }}
    </button>

    <a href="{{ url_for('list_departamentos_asignatura') }}" class="btn btn-secondary">
        Cancelar
    </a>
</form>
{% endblock %}
