{% extends "base.html" %}

{% block title %}{{ 'Editar' if carrera else 'Añadir' }} Carrera{% endblock %}

{% block content %}
<h1 class="mb-4">{{ 'Editar' if carrera else 'Añadir' }} Carrera</h1>

<form method="post">

    {% if not carrera %}
    {# ID is auto-generated #}
    {% else %}
    <div class="mb-3">
        <label class="form-label">ID Carrera</label>
        <input type="text" class="form-control" value="{{ carrera.idcarrera }}" readonly disabled>
    </div>
    {% endif %}

    <div class="mb-3">
        <label class="form-label">Descripción</label>
        <input type="text" class="form-control" name="descripcion_carrera"
            value="{{ carrera.descripcion_carrera if carrera else '' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Créditos</label>
        <input type="number" class="form-control" name="creditos_carrera"
            value="{{ carrera.creditos_carrera if carrera else '' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Departamento Académico</label>
        <select class="form-select" name="iddepartamentoacademico" required>
            <option value="" disabled {{ 'selected' if not carrera }}>Seleccione...</option>

            {% for d in departamentos %}
            <option value="{{ d.iddepartamentoacademico }}" {% if carrera and
                carrera.iddepartamentoacademico==d.iddepartamentoacademico %}selected{% endif %}>
                {{ d.iddepartamentoacademico }} - {{ d.nombre_departamento }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Costo inscripción</label>
        <input type="number" step="0.01" class="form-control" name="costo_inscripcion"
            value="{{ carrera.costo_inscripcion if carrera else '' }}" required>
    </div>

    <button class="btn btn-primary">{{ 'Actualizar' if carrera else 'Guardar' }}</button>
    <a href="{{ url_for('list_carreras') }}" class="btn btn-secondary">Cancelar</a>

</form>
{% endblock %}
