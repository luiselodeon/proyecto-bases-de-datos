version: '3.8'

services:
  luis_ex_par_so_web:
    build: .
    container_name: luis_ex_par_so_web
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - luis_ex_par_so_db

  luis_ex_par_so_db:
    image: postgres:13
    container_name: luis_ex_par_so_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - luis_ex_par_so_postgres_data:/var/lib/postgresql/data

volumes:
  luis_ex_par_so_postgres_data:
